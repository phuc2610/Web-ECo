    <path d="M8 32.5h32a2 2 0 011.8 1.2l.8 1.8a1 1 0 01-.9 1.5H6.3a1 1 0 01-.9-1.5l.8-1.8A2 2 0 018 32.5z" fill="#ffffff" opacity="0.9" />
    <rect x="29" y="20" width="16" height="27" rx="3.5" stroke="#ffffff" stroke-width="2" fill="#0f172a" />
    <rect x="31" y="23" width="12" height="20" rx="2" fill="url(#mtCyanAccentAdmin)" opacity="0.85" />
    <rect x="34.5" y="21.2" width="5" height="1.2" rx="0.6" fill="#ffffff" opacity="0.9" />
    <rect x="34" y="41.2" width="6" height="1" rx="0.5" fill="#ffffff" opacity="0.8" />
    <circle cx="45" cy="11" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(74, 0)">
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
